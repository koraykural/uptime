name: Check sites

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 3 * * 1' # weekly keepalive, see below
  workflow_dispatch:

permissions:
  issues: write
  actions: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./check.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # GitHub turns off scheduled workflows in a repo with no activity for
      # 60 days. Re-enabling it through the API resets that clock.
      - name: Keepalive
        if: always() && github.event.schedule == '17 3 * * 1'
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
